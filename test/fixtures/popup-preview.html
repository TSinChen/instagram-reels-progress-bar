<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popup preview</title>
<!--
  Renders the popup in an ordinary page. It fetches the real
  entrypoints/popup/index.html and loads its main.js rather than duplicating any markup,
  so this page cannot drift from the popup. The chrome APIs are backed by memory.
-->
<style>
  body { margin: 0; background: #3a3a3a; }
  #frame {
    width: 300px;
    margin: 24px auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    border-radius: 10px;
    overflow: hidden;
  }
  /* ?bare=1 drops the frame and backdrop for the screenshot iframe */
  body.bare { background: transparent; }
  body.bare #frame { margin: 0; box-shadow: none; border-radius: 0; }
</style>
</head>
<body>
<script>
  // In-memory chrome APIs, only what the popup touches
  const memory = {};
  const changeListeners = [];
  window.chrome = {
    i18n: {
      getMessage: (key) => (window.__messages && window.__messages[key]?.message) || '',
      getUILanguage: () =>
        (new URLSearchParams(location.search).get('locale') || 'en').replace('_', '-'),
    },
    storage: {
      sync: {
        async get(key) { return key in memory ? { [key]: memory[key] } : {}; },
        async set(patch) {
          const changes = {};
          for (const [k, v] of Object.entries(patch)) {
            changes[k] = { oldValue: memory[k], newValue: v };
            memory[k] = v;
          }
          changeListeners.forEach((fn) => fn(changes));
        },
        onChanged: {
          addListener: (fn) => changeListeners.push(fn),
          removeListener: (fn) => {
            const i = changeListeners.indexOf(fn);
            if (i >= 0) changeListeners.splice(i, 1);
          },
        },
      },
    },
  };
</script>

<script type="module">
  const params = new URLSearchParams(location.search);
  if (params.get('bare') === '1') document.body.classList.add('bare');
  const locale = params.get('locale') || 'en';
  window.__messages = await (await fetch(`/public/_locales/${locale}/messages.json`)).json();

  const html = await (await fetch('/entrypoints/popup/index.html')).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');

  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = '/entrypoints/popup/style.css';
  document.head.appendChild(link);
  await new Promise((r) => { link.onload = r; link.onerror = r; });

  // The popup stylesheet sizes body; here that belongs on the frame
  const frame = document.createElement('div');
  frame.id = 'frame';
  for (const node of [...parsed.body.children]) {
    if (node.tagName === 'SCRIPT') continue;
    frame.appendChild(node);
  }
  document.body.appendChild(frame);

  // The popup's only interval is the one advancing its preview clock, and the screenshot
  // script needs that clock still so repeated runs produce identical pixels
  if (params.has('still')) window.setInterval = () => 0;

  await import('/entrypoints/popup/main.js');
  window.__popupReady = true;
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Bundle 驗證 — 載入 dist/content.js</title>
<!--
  這一頁載入的是 dist/content.js（實際會被擴充功能注入的那支 classic script），
  而不是 src/ 的 ES modules。目的是確認攤平後的產出行為與模組版一致。
  另外刻意加上與 Instagram 相近的嚴格 CSP，確認腳本不會被擋。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; object-src 'none'">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
  .section { padding: 24px; border-bottom: 1px solid #262626; }
  .section h2 { font-size: 14px; color: #a8a8a8; margin: 0 0 16px; }
  .reels { display: flex; justify-content: center; }
  .reels video {
    width: 380px; height: 675px;
    background: linear-gradient(160deg, #3a1c71, #d76d77, #ffaf7b);
    object-fit: cover;
  }
  .feed { max-width: 470px; margin: 0 auto; }
  .feed video {
    width: 100%; height: 585px; display: block;
    background: linear-gradient(200deg, #0f2027, #203a43, #2c5364);
    object-fit: cover;
  }
  .thumbs { display: flex; gap: 8px; }
  .thumbs video { width: 60px; height: 60px; background: #555; }
</style>
</head>
<body>

<div class="section">
  <h2>版面 A — Reels 專頁</h2>
  <div class="reels">
    <video id="reel-1" data-duration="32" data-start="7" muted playsinline></video>
  </div>
</div>

<div class="section">
  <h2>版面 B — 首頁 feed</h2>
  <div class="feed">
    <video id="feed-1" data-duration="45" data-start="30" muted playsinline></video>
  </div>
</div>

<div class="section">
  <h2>小縮圖 — 不應出現進度條</h2>
  <div class="thumbs">
    <video id="thumb-1" data-duration="10" muted playsinline></video>
  </div>
</div>

<!-- 先把影片的媒體屬性換成可控的假值，再載入 bundle（模擬擴充功能注入） -->
<script src="./stub-videos.js"></script>
<script src="../../dist/content.js"></script>
</body>
</html>

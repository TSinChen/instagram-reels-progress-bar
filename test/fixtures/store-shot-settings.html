<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot layout — settings</title>
<!-- 1280x800 store screenshot showing the settings popup, embedded through an iframe. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: radial-gradient(120% 120% at 80% 0%, #1d1b2e 0%, #08080b 60%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    display: grid;
    grid-template-columns: 460px 1fr;
    align-items: center;
    gap: 64px;
    padding: 0 72px;
  }

  .copy h1 {
    margin: 0 0 18px;
    font-size: 44px;
    line-height: 1.12;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .copy p {
    margin: 0 0 28px;
    font-size: 18px;
    line-height: 1.6;
    color: #b9b9c4;
  }
  .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
  .points li {
    display: flex; gap: 12px; align-items: flex-start;
    font-size: 16px; line-height: 1.5; color: #e6e6ec;
  }
  .points b {
    flex: none;
    width: 7px; height: 7px; margin-top: 8px;
    border-radius: 50%;
    background: #2dd4bf;
  }

  .panel { display: flex; justify-content: center; }
  iframe {
    width: 300px;
    height: 484px;
    border: 0;
    border-radius: 12px;
    box-shadow: 0 36px 80px rgba(0, 0, 0, .7);
  }
</style>
</head>
<body>

<div class="copy" id="copy"></div>

<div class="panel">
  <iframe id="popup" title="settings"></iframe>
</div>

<script>
  const COPY = {
    en: {
      h1: 'Tune it to taste.',
      p: 'Bar thickness, handle size, hover area, and a time label you can switch off.',
      points: [
        'Changes apply to open tabs instantly',
        'Shrink the hover area if it covers Instagram’s buttons',
        'Settings sync across your Chrome profile',
      ],
    },
    zh_TW: {
      h1: '調成你喜歡的樣子。',
      p: '進度條粗細、圓點大小、感應區高度，時間標籤也能關掉。',
      points: [
        '改完立刻套用到所有開著的分頁',
        '會擋到 Instagram 按鈕就把感應區調小',
        '設定跟著 Chrome 帳號同步',
      ],
    },
  };
  const params = new URLSearchParams(location.search);
  const locale = params.get('copy') || 'en';
  const c = COPY[locale] || COPY.en;
  document.getElementById('copy').innerHTML =
    '<h1>' + c.h1 + '</h1><p>' + c.p + '</p><ul class="points">' +
    c.points.map((t) => '<li><b></b><span>' + t + '</span></li>').join('') +
    '</ul>';
  document.getElementById('popup').src =
    './popup-preview.html?locale=' + locale + '&bare=1' + (params.has('still') ? '&still=1' : '');
</script>
</body>
</html>

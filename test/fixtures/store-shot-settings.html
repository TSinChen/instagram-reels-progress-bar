<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot layout — settings</title>
<!-- 1280x800 store screenshot showing the settings popup, embedded through an iframe. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: radial-gradient(120% 120% at 80% 0%, #1d1b2e 0%, #08080b 60%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    display: grid;
    grid-template-columns: 460px 1fr;
    align-items: center;
    gap: 64px;
    padding: 0 72px;
  }

  .copy h1 {
    margin: 0 0 18px;
    font-size: 44px;
    line-height: 1.12;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .copy p {
    margin: 0 0 28px;
    font-size: 18px;
    line-height: 1.6;
    color: #b9b9c4;
  }
  .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
  .points li {
    display: flex; gap: 12px; align-items: flex-start;
    font-size: 16px; line-height: 1.5; color: #e6e6ec;
  }
  .points b {
    flex: none;
    width: 7px; height: 7px; margin-top: 8px;
    border-radius: 50%;
    background: #2dd4bf;
  }

  .panel { display: flex; justify-content: center; }
  iframe {
    width: 300px;
    /* Starting height only; shots.mjs resizes this to whatever the locale's popup needs */
    height: 437px;
    border: 0;
    border-radius: 12px;
    box-shadow: 0 36px 80px rgba(0, 0, 0, .7);
  }
</style>
</head>
<body>

<div class="copy" id="copy"></div>

<div class="panel">
  <iframe id="popup" title="settings"></iframe>
</div>

<script src="./shot-copy.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const locale = params.get('copy') || 'en';
  renderShotCopy('settings');
  document.getElementById('popup').src =
    './popup-preview.html?locale=' + locale + '&bare=1' + (params.has('still') ? '&still=1' : '');
</script>
</body>
</html>

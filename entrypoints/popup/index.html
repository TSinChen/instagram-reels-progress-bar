<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Reels Progress Bar</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="bar">
  <span class="mark" aria-hidden="true"></span>
  <h1 class="wordmark" data-i18n="popupTitle">Instagram Reels Progress Bar</h1>
</header>

<!--
  預覽區掛的是真正的 ProgressBar 元件，配一支假影片，可以實際拖曳。
  底圖從暗漸層到亮，是為了讓使用者判斷進度條在亮畫面上的可讀性。
-->
<div class="stage" id="stage">
  <span class="stage-hint" data-i18n="previewHint">Drag it</span>
</div>

<main class="settings">

  <section class="field">
    <div class="field-head">
      <h2 class="label"><label for="thickness" data-i18n="settingThickness">Bar thickness</label></h2>
      <output class="readout" id="thickness-value" for="thickness">3px</output>
    </div>
    <input type="range" id="thickness" min="2" max="8" step="1" value="3">
  </section>

  <section class="field">
    <div class="field-head">
      <h2 class="label"><label for="handle" data-i18n="settingHandle">Handle size</label></h2>
      <output class="readout" id="handle-value" for="handle">12px</output>
    </div>
    <input type="range" id="handle" min="8" max="20" step="1" value="12">
  </section>

  <section class="field">
    <div class="field-head">
      <h2 class="label"><label for="hitzone" data-i18n="settingHitZone">Hover area height</label></h2>
      <output class="readout" id="hitzone-value" for="hitzone">16px</output>
    </div>
    <input type="range" id="hitzone" min="8" max="32" step="1" value="16">
    <p class="hint" data-i18n="settingHitZoneHint">
      The strip at the bottom of the video that the progress bar takes over.
    </p>
  </section>

  <section class="field field-row">
    <h2 class="label"><label for="showlabel" data-i18n="settingShowLabel">Show time label</label></h2>
    <input type="checkbox" id="showlabel" class="switch" checked>
  </section>

</main>

<footer class="bar bar-foot">
  <button type="button" id="reset" class="reset" data-i18n="reset">Reset to defaults</button>
  <span class="saved" id="saved" role="status" data-i18n="saved">Saved</span>
</footer>

<script type="module" src="./main.js"></script>
</body>
</html>

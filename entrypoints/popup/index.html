<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels Scrubber</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="bar">
  <span class="mark" aria-hidden="true"></span>
  <h1 class="wordmark" data-i18n="popupTitle">Reels Scrubber</h1>
</header>

<!--
  預覽區掛的是真正的 ProgressBar 元件，配一支假影片，可以實際拖曳。
  底圖從暗漸層到亮，是為了讓使用者判斷進度條在亮畫面上的可讀性。
-->
<div class="stage" id="stage">
  <span class="stage-hint" data-i18n="previewHint">Drag it</span>
</div>

<main class="settings">

  <section class="field">
    <h2 class="label" data-i18n="settingColor">Bar color</h2>
    <div class="swatches" role="radiogroup" aria-labelledby="color-label" id="colors">
      <button type="button" class="swatch" data-color="white" role="radio" aria-checked="true">
        <span class="chip chip-white"></span>
        <span class="swatch-name" data-i18n="settingColorWhite">White</span>
      </button>
      <button type="button" class="swatch" data-color="red" role="radio" aria-checked="false">
        <span class="chip chip-red"></span>
        <span class="swatch-name" data-i18n="settingColorRed">Red</span>
      </button>
      <button type="button" class="swatch" data-color="blue" role="radio" aria-checked="false">
        <span class="chip chip-blue"></span>
        <span class="swatch-name" data-i18n="settingColorBlue">Blue</span>
      </button>
    </div>
  </section>

  <section class="field">
    <div class="field-head">
      <h2 class="label"><label for="hitzone" data-i18n="settingHitZone">Hover area height</label></h2>
      <output class="readout" id="hitzone-value" for="hitzone">16px</output>
    </div>
    <input type="range" id="hitzone" min="8" max="32" step="1" value="16">
    <p class="hint" data-i18n="settingHitZoneHint">
      The strip at the bottom of the video that the scrubber takes over.
    </p>
  </section>

  <section class="field field-row">
    <h2 class="label"><label for="showlabel" data-i18n="settingShowLabel">Show time label</label></h2>
    <input type="checkbox" id="showlabel" class="switch" checked>
  </section>

</main>

<footer class="bar bar-foot">
  <button type="button" id="reset" class="reset" data-i18n="reset">Reset to defaults</button>
  <span class="saved" id="saved" role="status" data-i18n="saved">Saved</span>
</footer>

<script type="module" src="./main.js"></script>
</body>
</html>

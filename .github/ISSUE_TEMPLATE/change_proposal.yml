name: Change proposal
description: Propose a new feature or a larger change to the Instagram Reels Progress Bar extension.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What are you trying to accomplish? If this affects a specific Instagram view, mention it here.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or change you'd like to see. If you have an implementation approach in mind, include it here.
    validations:
      required: true
